services:
  - type: web
    name: taxsaathi
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: npm ci && npm --prefix client ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_ALLOW_SNAPSHOT
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
