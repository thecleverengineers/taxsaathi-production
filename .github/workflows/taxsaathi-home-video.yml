name: Publish TaxSaathi homepage video

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/taxsaathi-home-video.yml'

permissions:
  contents: write

jobs:
  import-video:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out TaxSaathi main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download supplied TaxSaathi film into the website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p client/public/media
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_35jIl5jZWKG5RRMETOQUSKTvh7o/8a5c3b32-66b6-452d-acc9-b9253f1e7e1b.mp4' \
            --output client/public/media/taxsaathi-intro.mp4
          test "$(wc -c < client/public/media/taxsaathi-intro.mp4)" -gt 1000000
          file client/public/media/taxsaathi-intro.mp4
      - name: Commit self-hosted video file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/public/media/taxsaathi-intro.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'Store uploaded TaxSaathi homepage promotional film'
            git push origin HEAD:main
          fi
